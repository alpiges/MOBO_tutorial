<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" style="background:#f9fbff;">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="980" height="260" fill="#f9fbff"/>

  <!-- ── Box 1: Target identification  x=62, w=120 ── -->
  <rect x="62"  y="60" width="120" height="68" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="122" y="88"  text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">Target</text>
  <text x="122" y="104" text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">identification</text>
  <text x="122" y="148" text-anchor="middle" font-size="14" fill="#64748b" font-family="Georgia, serif">1 – 2 years</text>

  <!-- Arrow 1→2 -->
  <line x1="184" y1="94" x2="196" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Box 2: Lead identification  x=198, w=120 ── -->
  <rect x="198" y="60" width="120" height="68" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="258" y="88"  text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">Lead</text>
  <text x="258" y="104" text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">identification</text>
  <text x="258" y="148" text-anchor="middle" font-size="14" fill="#64748b" font-family="Georgia, serif">1 – 2 years</text>

  <!-- Arrow 2→3 -->
  <line x1="320" y1="94" x2="332" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Box 3: Lead optimization — HIGHLIGHTED  x=334, w=120 ── -->
  <rect x="334" y="60" width="120" height="68" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="394" y="88"  text-anchor="middle" font-size="16"  fill="#92400e" font-family="Georgia, serif">Lead</text>
  <text x="394" y="104" text-anchor="middle" font-size="16"  fill="#92400e" font-family="Georgia, serif">optimization</text>
  <text x="394" y="148" text-anchor="middle" font-size="14" fill="#64748b" font-family="Georgia, serif">1 – 2 years</text>

  <!-- Arrow 3→4 -->
  <line x1="456" y1="94" x2="468" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Box 4: Pre-clinical  x=470, w=120 ── -->
  <rect x="470" y="60" width="120" height="68" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="530" y="88"  text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">Pre-clinical</text>
  <text x="530" y="104" text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">trials</text>
  <text x="530" y="148" text-anchor="middle" font-size="14" fill="#64748b" font-family="Georgia, serif"> ~1 year</text>

  <!-- Arrow 4→5 -->
  <line x1="592" y1="94" x2="604" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Box 5: Clinical trials  x=606, w=120 ── -->
  <rect x="606" y="60" width="120" height="68" rx="6" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
  <text x="666" y="88"  text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">Clinical</text>
  <text x="666" y="104" text-anchor="middle" font-size="16"  fill="#0c4a6e" font-family="Georgia, serif">trials (I–III)</text>
  <text x="666" y="148" text-anchor="middle" font-size="14" fill="#64748b" font-family="Georgia, serif">6 – 7 years</text>

  <!-- Arrow 5→6 -->
  <line x1="728" y1="94" x2="740" y2="94" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ── Box 6: Drug approval  x=742, w=120 ── -->
  <rect x="742" y="60" width="120" height="68" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="802" y="88"  text-anchor="middle" font-size="16"  fill="#14532d" font-family="Georgia, serif">Drug</text>
  <text x="802" y="104" text-anchor="middle" font-size="16"  fill="#14532d" font-family="Georgia, serif">approval</text>
  <text x="802" y="148" text-anchor="middle" font-size="14" fill="#64748b" font-family="Georgia, serif">1 – 2 years</text>

  <!-- ── Timeline bar at bottom ── -->
  <line x1="62" y1="170" x2="862" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="480" y="190" text-anchor="middle" font-size="16" fill="#475569" font-family="Georgia, serif">Typically >10 years from target identification to market</text>

</svg>
