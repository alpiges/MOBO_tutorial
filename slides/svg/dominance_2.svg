        fill="#cae7ff" stroke="#003865" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- axes -->
  <line x1="35" y1="170" x2="208" y2="170" stroke="#000000" stroke-width="1.5"/>
  <line x1="35" y1="170" x2="35"  y2="12"  stroke="#000000" stroke-width="1.5"/>
  <polygon points="208,167 213,170 208,173" fill="#000000"/>
  <polygon points="32,12 35,7 38,12"        fill="#000000"/>
  <text x="214" y="174" font-size="16" fill="#000000">f&#x2081;</text>
  <text x="20"  y="12"  font-size="16" fill="#000000">f&#x2082;</text>
  <!-- y -->
  <circle cx="177" cy="128" r="5" fill="#003865"/>
  <text x="183" y="124" font-size="16" font-weight="700" fill="#003865">y</text>
  <!-- y' (above region, not dominated) -->
  <circle cx="106" cy="65" r="5" fill="#830051"/>
