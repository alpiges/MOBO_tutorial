[project]
name = "mobo-tutorial"
version = "0.1.0"
description = "Hands-on Python tutorial for multi-objective Bayesian optimization"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "torch>=2.3",
  "gpytorch>=1.12",
  "botorch>=0.11",
  "pyro-ppl>=1.9",
]

[dependency-groups]
dev = [
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
